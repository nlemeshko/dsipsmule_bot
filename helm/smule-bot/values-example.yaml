# Пример конфигурации для smule-bot (Telegram бот)
# Скопируйте этот файл в values.yaml и заполните ваши значения

replicaCount: 1

image:
  repository: ghcr.io/nlemeshko/dsipsmule_bot
  pullPolicy: IfNotPresent
  tag: "latest"

# Секреты для загрузки образов
imagePullSecrets: 
  - name: regcred

# Использование существующего секрета (рекомендуется)
existingSecret:
  name: "env"  # Имя вашего существующего секрета в Kubernetes
  keys: {}     # Дополнительные переменные (опционально)

# Переменные окружения (fallback, если не используется existingSecret)
env:
  # ОБЯЗАТЕЛЬНЫЕ ПЕРЕМЕННЫЕ - заполните эти значения
  BOT_TOKEN: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
  
  # ОПЦИОНАЛЬНЫЕ ПЕРЕМЕННЫЕ
  ADMINS: "123456789,987654321"
  CHARACTER_AI_TOKEN: ""
  CHARACTER_ID: ""
  CHARACTER_VOICE_ID: ""
  TZ: "Europe/Kyiv"
  MINI_APP_URL: "https://bot.dsipsmule.one"
  MINI_APP_HOST: "0.0.0.0"
  MINI_APP_PORT: "8080"
  MINI_APP_AUTH_MAX_AGE: "3600"

service:
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "21m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "180"
  hosts:
    - host: bot.dsipsmule.one
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: bot-dsipsmule-one-tls
      hosts:
        - bot.dsipsmule.one


# Настройки PersistentVolume
persistence:
  enabled: false
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  annotations: {}

# Ресурсы
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Безопасность
securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 10001
  allowPrivilegeEscalation: false

podSecurityContext:
  fsGroup: 10001
