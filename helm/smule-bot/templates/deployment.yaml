{{- $appEnv := mergeOverwrite (dict "MINI_APP_URL" .Values.env.MINI_APP_URL "MINI_APP_HOST" .Values.env.MINI_APP_HOST "MINI_APP_PORT" .Values.env.MINI_APP_PORT "MINI_APP_AUTH_MAX_AGE" .Values.env.MINI_APP_AUTH_MAX_AGE "DATA_DIR" (.Values.env.DATA_DIR | default "/data")) (deepCopy .Values.existingSecret.keys) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "smule-bot.fullname" . }}
  labels:
    {{- include "smule-bot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "smule-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "smule-bot.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "smule-bot.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $appEnv.MINI_APP_PORT | int }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret.name | default "env" }}
            {{- if .Values.configMap.create }}
            - configMapRef:
                name: {{ include "smule-bot.fullname" . }}-config
            {{- end }}
          env:
            {{- range $key, $value := $appEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if $appEnv.MINI_APP_URL }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ $appEnv.DATA_DIR }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "smule-bot.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
