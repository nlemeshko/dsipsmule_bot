name: SMULE-BOT

on:
  push:
    branches: [ master ]

permissions: write-all

env:
  REGISTRY: ghcr.io
  GITHUB_TOKEN: ${{ github.token }}
  IMAGE_NAME: ${{ github.repository }}
  ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
jobs:
  build:

    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Bump version and push tag
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@79abd3f86f79a9d68a23c75a09a9a85889262adf

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v3.6.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=sha,format=long

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.ACCESS_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v3
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.new_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubectl for K3s
        env:
          K3S_KUBECONFIG_BASE64: ${{ secrets.K3S_KUBECONFIG }}
        run: |
          if [ -z "$K3S_KUBECONFIG_BASE64" ]; then
            echo "::error::GitHub Actions secret K3S_KUBECONFIG is empty or unavailable."
            exit 1
          fi
          umask 077
          printf '%s' "$K3S_KUBECONFIG_BASE64" | base64 -d > kubeconfig
          chmod 600 kubeconfig
          export KUBECONFIG=kubeconfig
          kubectl config set-context --current --namespace=default
          
      - name: Check if secrets exist
        run: |
          export KUBECONFIG=kubeconfig
          for secret_name in env regcred; do
            if ! secret_resource=$(kubectl get secret "$secret_name" -n smule-bot --ignore-not-found -o name --request-timeout=30s); then
              echo "::error::Cannot check Secret '$secret_name'. See kubectl error above. Check K3S_KUBECONFIG credentials, API connectivity and access to namespace smule-bot."
              exit 1
            fi
            if [ -z "$secret_resource" ]; then
              echo "::error::Secret '$secret_name' not found in namespace smule-bot. Create it before deployment."
              exit 1
            fi
            echo "✅ Found $secret_resource in namespace smule-bot"
          done

      - name: Get latest tag
        id: get_tag
        run: |
          echo "tag=${{ needs.build.outputs.new_tag }}" >> $GITHUB_OUTPUT

      - name: Deploy to K3s with Helm
        run: |
          export KUBECONFIG=kubeconfig
          helm upgrade --install smule-bot ./helm/smule-bot \
            --set image.tag=${{ steps.get_tag.outputs.tag }} \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} \
            --set existingSecret.name=env \
            --namespace smule-bot \
            --create-namespace \
            --wait \
            --timeout=5m
            
      - name: Verify deployment
        run: |
          export KUBECONFIG=kubeconfig
          echo "📊 Checking deployment status..."
          kubectl get pods -n smule-bot -l app.kubernetes.io/name=smule-bot
          kubectl get pvc -n smule-bot -l app.kubernetes.io/name=smule-bot
          echo "✅ Deployment completed successfully!"
